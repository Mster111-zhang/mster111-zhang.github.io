<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="张艺豪的个人网站">
  <meta name="theme-color" content="#090d1c">
  <title>张艺豪 · 个人网站</title>
  <link rel="stylesheet" href="style.css">
</head>
<body id="top">
  <a class="skip" href="#main">跳到正文</a>
  <header class="topbar wrap">
    <a class="brand" href="#top" aria-label="张艺豪，回到顶部"><span>ZY</span><span class="wordmark">YIHAO ZHANG</span></a>
    <nav aria-label="主导航">
      <a href="#about">关于</a>
      <a href="#projects">项目</a>
      <a href="#experience">经历</a>
      <a class="nav-contact" href="#contact">联系 <span aria-hidden="true">↗</span></a>
    </nav>
  </header>
  <main id="main">
    <section class="hero wrap" aria-labelledby="name">
      <div class="hero-copy">
        <h1 id="name">张艺豪<span>.</span></h1>
        <p class="headline">个人网站</p>
        <a class="button primary" href="#about">浏览栏目 <span aria-hidden="true">↓</span></a>
      </div>
      <div class="hero-art" aria-hidden="true">
        <img src="agent-glass.webp" width="1100" height="1100" alt="" fetchpriority="high">
      </div>
    </section>
    <div class="paper">
      <section id="about" class="section wrap" aria-labelledby="about-title">
        <h2 id="about-title">关于我</h2>
        <div class="about-panel empty">
          <p>个人简介待补充</p>
          <div class="lines" aria-hidden="true"><span></span><span></span></div>
        </div>
      </section>
      <section id="projects" class="section wrap" aria-labelledby="projects-title">
        <h2 id="projects-title">项目</h2>
        <div class="project-grid">
          <article class="project">
            <div class="cover cover-blue" aria-hidden="true"></div>
            <div class="slot">
              <h3>项目待补充</h3>
              <div class="lines" aria-hidden="true"><span></span><span></span></div>
            </div>
          </article>
          <article class="project">
            <div class="cover cover-green" aria-hidden="true"></div>
            <div class="slot">
              <h3>项目待补充</h3>
              <div class="lines" aria-hidden="true"><span></span><span></span></div>
            </div>
          </article>
        </div>
      </section>
      <section id="experience" class="section wrap" aria-labelledby="experience-title">
        <h2 id="experience-title">经历</h2>
        <div class="history-grid">
          <article class="empty">
            <h3>教育经历</h3>
            <div class="lines" aria-hidden="true"><span></span><span></span></div>
          </article>
          <article class="empty">
            <h3>实习经历</h3>
            <div class="lines" aria-hidden="true"><span></span><span></span></div>
          </article>
        </div>
      </section>
      <section id="contact" class="section contact wrap" aria-labelledby="contact-title">
        <div class="contact-card">
          <h2 id="contact-title">联系</h2>
          <p>联系方式待补充</p>
        </div>
      </section>
    </div>
  </main>
  <footer class="footer">
    <div class="wrap"><span>© 张艺豪</span><a href="#top">回到顶部 ↑</a></div>
  </footer>
</body>
</html>
